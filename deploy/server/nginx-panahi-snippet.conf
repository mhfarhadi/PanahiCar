# Include INSIDE the existing server { } block for 185.8.173.114
# Example in sites-enabled/default or maya config:
#   include /etc/nginx/snippets/panahi-car.conf;

location = /panahi {
    return 301 /panahi/;
}

location ^~ /panahi/ {
    alias /var/www/panahi/public/;
    index index.php;
    try_files $uri $uri/ @panahi_rewrite;
}

location ~ ^/panahi/index\.php(/|$) {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/panahi/public/index.php;
    fastcgi_param PATH_INFO $fastcgi_path_info;
    fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
}

location @panahi_rewrite {
    rewrite ^/panahi/(.*)$ /panahi/index.php?/$1 last;
}

# Static build assets (optional fallback if alias misses a file)
location ^~ /panahi/build/ {
    alias /var/www/panahi/public/build/;
    access_log off;
    expires 30d;
}
