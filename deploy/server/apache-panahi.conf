# Optional Apache snippet if symlink is not used.
# Include from a NEW file, e.g. /etc/apache2/conf-available/panahi-car.conf
# Does not modify existing VirtualHost for MayaHamrah.

Alias /panahi /var/www/panahi/public

<Directory /var/www/panahi/public>
    Options FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>
