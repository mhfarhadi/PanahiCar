# Panahi Car — Nginx snippet (add INSIDE the existing server { } block for 185.8.173.114)
# Does not replace or edit MayaHamrah routes — only adds /panahi.
#
# Install:
#   sudo cp deploy/server/nginx-panahi.conf /etc/nginx/conf.d/panahi-car.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Change php8.4-fpm.sock if your PHP version differs:
#   ls /var/run/php/

location ^~ /panahi/ {
    alias /var/www/panahi/public/;
    index index.php;
    try_files $uri $uri/ @panahi;

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $request_filename;
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
    }
}

location @panahi {
    rewrite ^/panahi/(.*)$ /panahi/index.php?/$1 last;
}

location = /panahi {
    return 301 /panahi/;
}
